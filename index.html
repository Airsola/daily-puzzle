<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>每日拼图</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><div><h1>每日拼图</h1><span class="brand-note">把日子，慢慢拼好。</span></div></div>
    <div class="goal"><span class="eyebrow">留给今天的三格</span><b id="goal"></b><span id="done" class="badge" hidden>已完成</span></div>
    <div class="meta">
      <input type="date" id="date" aria-label="选择日期">
      <button id="today" type="button">今天</button>
      <span id="timer" aria-label="用时">00:00</span>
      <button id="render-mode" type="button" aria-pressed="false" title="切换立体与二维兼容视图">立体视图</button>
    </div>
  </header>

  <main id="stage">
    <svg id="game" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="每日拼图棋盘">
      <g id="board"></g>
      <g id="ghost"></g>
      <g id="pieces"></g>
    </svg>
  </main>

  <footer class="bar tools">
    <button id="rotate" type="button">↻ 旋转</button>
    <button id="flip" type="button">⇋ 翻转</button>
    <button id="hint" type="button">提示一块</button>
    <button id="reset" type="button">重置</button>
    <button id="answer" type="button">答案</button>
  </footer>
  <p class="help">把零件拖到棋盘上，盖住其他格子，只露出目标的月、日、星期。点一下零件旋转，右键或「翻转」镜像；键盘 R 旋转、F 翻转。<br><a class="help-link" href="solution-encoding-demo.html">解法编码与全量统计</a></p>

  <div id="toast" role="status"></div>

  <div id="modal" hidden>
    <div class="card">
      <h2 id="modal-title">完成！</h2>
      <p id="modal-text"></p>
      <div class="row">
        <button id="modal-cancel" type="button" class="secondary" hidden>取消</button>
        <button id="modal-close" type="button">好的</button>
      </div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/renderer3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
